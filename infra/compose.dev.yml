# Development with one command, without installing .NET, Node or ffmpeg (from the repo root):
#
#   docker compose -f infra/compose.dev.yml --env-file infra/local.env up --build
#
#   API (dotnet watch)  http://localhost:5090/api/health
#   Admin (Vite)        http://localhost:5173/admin/      password: admin
#   Site (astro dev)    http://localhost:4321/
#
# The code is mounted from your disk (live reload); node_modules, bin/obj, NuGet and the data live in volumes of the
# blog-dev project, so they do not clash with the Windows ones. Only for your PC: test values and ports only on
# 127.0.0.1. Ports in use: API_PORT, ADMIN_PORT and WEB_PORT change the ones on your PC's side (see README).
#
# The admin password and the token come from infra/local.env, the same file the local production copy uses: they change
# in one place. Without --env-file, compose says what is missing instead of starting with other values.

name: blog-dev

# Capped logs (dotnet watch, Vite and Astro write a lot in a day): the same as in production.
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

# API ↔ site token (Builder__Token there, BUILDER_TOKEN here): defined once.
x-builder-token: &builder-token ${BUILDER_TOKEN:?BUILDER_TOKEN is missing, start with --env-file infra/local.env (see README)}

# Where the admin and the site find the API (over the compose network) and where your browser sees the site (the
# admin's "View site" links and astro dev's absolute URLs): they follow WEB_PORT if you change it.
x-dev-urls: &dev-urls
  API_URL: http://api:5090
  SITE_URL: http://localhost:${WEB_PORT:-4321}

# The three Node services use the same image (Node + pnpm from package.json) and the same volumes.
x-node: &node
  logging: *logging
  build:
    context: ..
    dockerfile: apps/builder/Dockerfile
    target: dev
  image: blog-dev-node
  volumes:
    - ..:/repo
    # Cover the Windows node_modules (links and binaries that do not work on Linux) and the Astro cache.
    - node_modules:/repo/node_modules
    - admin_node_modules:/repo/apps/admin/node_modules
    - web_node_modules:/repo/apps/web/node_modules
    - markdown_node_modules:/repo/packages/markdown/node_modules
    - astro_cache:/repo/apps/web/.astro

services:
  api:
    logging: *logging
    build:
      context: ../apps/api
      target: dev
    image: blog-dev-api
    ports:
      - "127.0.0.1:${API_PORT:-5090}:5090"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Password "admin" (local.env). Another one: README, "Local production copy".
      Admin__PasswordHash: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH is missing, start with --env-file infra/local.env (see README)}
      Builder__Token: *builder-token
      # Data outside the mounted code: SQLite on a Windows folder is slow and must not mix with the `dotnet run`
      # database (apps/api/src/Blog.Api/data).
      ConnectionStrings__Blog: Data Source=/data/blog.db
      Media__Directory: /data/media
      Video__WorkDirectory: /data/video-work
      DataProtection__KeysDirectory: /data/keys
      # The projects' bin/ and obj/ go to a volume, outside the mounted code (the Windows ones are there).
      ArtifactsPath: /artifacts
      # Mounted Windows folders do not report changes inside the container: they are compared every so often.
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
    volumes:
      - ../apps/api:/repo/apps/api
      - api_artifacts:/artifacts
      - nuget:/root/.nuget/packages
      - api_data:/data

  # Installs the dependencies once and exits; the admin and the site start afterwards. If they are there, it takes
  # seconds.
  deps:
    <<: *node
    # The store goes in the root node_modules volume, where pnpm builds its .pnpm folder with every package: same disk,
    # so it hardlinks instead of copying, and it survives between starts. Each app's node_modules only has symlinks into
    # that folder.
    command: pnpm install --frozen-lockfile --store-dir /repo/node_modules/.pnpm-store --filter "@blog/admin..." --filter "@blog/web..."
    environment:
      CI: "true" # no terminal: pnpm must not ask before recreating node_modules
    restart: "no"

  admin:
    <<: *node
    command: pnpm --filter @blog/admin dev --host 0.0.0.0
    ports:
      - "127.0.0.1:${ADMIN_PORT:-5173}:5173"
    environment: *dev-urls
    depends_on:
      deps:
        condition: service_completed_successfully
      api:
        condition: service_started

  web:
    <<: *node
    command: pnpm --filter @blog/web dev --host 0.0.0.0
    ports:
      - "127.0.0.1:${WEB_PORT:-4321}:4321"
    environment:
      <<: *dev-urls
      BUILDER_TOKEN: *builder-token
    depends_on:
      deps:
        condition: service_completed_successfully
      api:
        condition: service_started

volumes:
  api_data: # SQLite, uploaded media, videos being processed and the cookie keys
  api_artifacts:
  nuget:
  node_modules:
  admin_node_modules:
  web_node_modules:
  markdown_node_modules:
  astro_cache:
