# The whole blog with one command:   docker compose --env-file .env up -d --build
# (run from the infra/ folder)
#
# Behind Dokploy (its Traefik owns 80/443 and TLS): this same file plus compose.dokploy.yml, which only changes Caddy.
#
# Resources sized for a shared VPS: every service has a memory cap, the build runs at low priority and visitors only
# reach Caddy (static files). The caps below are limits, not measured usage: measure with `docker stats` after the first
# deploy and adjust.
#
# Backups: infra/backup.sh (daily by cron) and infra/restore.sh.

name: blog

# Capped logs: the default driver (json-file) grows without limit and ends up filling the VPS disk. `local` compresses
# and rotates: at most 5 files of 10 MB per container. `docker compose logs` keeps working the same.
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

# Common to every service: capped logs, no process can gain privileges (setuid, file capabilities) and no Linux
# capability at all; each service adds back only the one it needs with cap_add. pids_limit stops a process or thread
# leak before it affects the rest of the VPS (it counts threads: .NET and ffmpeg use several).
x-service: &service
  logging: *logging
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256

# Healthcheck: every 30 s; while starting it asks every 2 s, so services waiting on `service_healthy` start as soon as
# this one is ready and not 30 s later. Failures during start_period do not count.
x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 60s
  start_interval: 2s

# Temporary files on the volume (disk) and not in the RAM of the container cap: upload bodies (up to 200 MB of video)
# and libvips temporary images (photos of up to 100 Mpx).
x-api-tmp: &api-tmp /data/tmp

# API <-> builder token (Builder__Token, BUILDER_TOKEN): written and required once, as in compose.dev.yml.
x-builder-token: &builder-token ${BUILDER_TOKEN:?Set BUILDER_TOKEN in .env (openssl rand -hex 32)}

services:
  # New volumes are born owned by root; the API (uid 1654) and the builder (uid 1000) need to write.
  # Runs on every `up`, fixes only what has another owner (it does not rewrite all the media every time) and exits.
  init-permissions:
    <<: *service
    image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    command:
      - sh
      - -euc
      - |
        mkdir -p /data/tmp /data/backups /media /site
        find /data /media \( ! -user 1654 -o ! -group 1654 \) -exec chown -h 1654:1654 {} +
        find /site \( ! -user 1000 -o ! -group 1000 \) -exec chown -h 1000:1000 {} +
    # CHOWN to change the owner; DAC_OVERRIDE to walk API or builder folders that root, without capabilities, cannot
    # read.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    read_only: true
    pids_limit: 32
    volumes:
      - api_data:/data
      - media:/media
      - site:/site
    restart: "no"

  caddy:
    <<: *service
    build:
      context: ..
      dockerfile: infra/caddy/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env (your domain)}
      # Optional: email for Let's Encrypt notices (expirations, certificate problems). Caddy does not accept an empty
      # `email`, so the Caddyfile gets the whole option or nothing.
      CADDY_ACME_EMAIL: ${ACME_EMAIL:+email ${ACME_EMAIL}}
      # production or staging: staging answers every request with X-Robots-Tag "noindex, nofollow" and a robots.txt
      # that disallows everything (Caddyfile, @staging).
      SITE_ENV: ${SITE_ENV:-production}
    # Root inside the container, but with no capabilities except opening ports 80/443, and with no-new-privileges.
    # Without root it would need high ports, and Caddy's HTTP→HTTPS redirect would then include that port.
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - caddy_data:/data # TLS certificates: persisting them avoids requesting a new one on every restart
      - caddy_config:/config
      - site:/srv/site:ro
      - media:/srv/media:ro
    healthcheck:
      <<: *healthcheck
      # Caddy's admin endpoint (localhost:2019 inside the container, never published): it answers once the Caddyfile
      # loaded. A config Caddy refuses (a SITE_ENV typo) never gets healthy, so `up --wait` (Dokploy's deploy,
      # restore.sh) fails instead of passing on a container that only ran for an instant. It does not ask the API: the
      # static site never depends on it. busybox wget comes with the image (no curl).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
    depends_on:
      # Only that the API has started, not that it is healthy: waiting for its healthcheck kept the static site down
      # for the whole start_period of a broken API. While the API does not answer, /api errors (502/503: Caddy's health
      # check takes it out) and the site is served anyway. required: false: if the API does not even start, Caddy
      # starts anyway.
      api:
        condition: service_started
        required: false
    # Measured with docker stats: ~26 MB serving the local copy.
    mem_limit: 128m

  api:
    <<: *service
    build:
      context: ../apps/api
    restart: unless-stopped
    # No `ports`: reachable only from Caddy and the builder, over Docker's internal network.
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_TEMP: *api-tmp
      TMPDIR: *api-tmp
      # One JSON line per event: it can be filtered with jq and log collectors read it without custom parsers.
      Logging__Console__FormatterName: json
      Admin__PasswordHash: ${ADMIN_PASSWORD_HASH:?Generate the hash with the hash-password command (see README)}
      Builder__Url: http://builder:4000
      Builder__Token: *builder-token
      ConnectionStrings__Blog: Data Source=/data/blog.db
      Media__Directory: /media
      DataProtection__KeysDirectory: /data/keys
      # Pending video originals and ffmpeg outputs: on the persistent volume and outside /media (which is published).
      # ffmpeg and ffprobe come with the image, on the PATH.
      Video__WorkDirectory: /data/video-work
    # Read-only filesystem: the API writes only to its volumes (/data, /media) and to /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    # ffmpeg encodes with several threads per stage and .NET adds its own: measured 84 at the peak of a 720p video (17
    # idle). SVT-AV1 creates threads by the host's cores, not by the cpus cap: headroom for a VPS with more cores.
    pids_limit: 512
    healthcheck:
      <<: *healthcheck
      # The API's own command-line mode: asks /api/health/ready (SQLite answers). The image has no curl.
      test: ["CMD", "dotnet", "Blog.Api.dll", "healthcheck"]
    volumes:
      - api_data:/data
      # nocopy: the image (Ubuntu) already has an empty /media owned by root, and Docker copies its owner to the volume
      # while it is empty: it undid init-permissions' chown and the first upload failed with "Permission denied".
      - media:/media:nocopy
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    # Measured with `docker stats` (ffmpeg 9.1, SVT-AV1 4.3), worst case: a 15 s 1080p video with heavy noise. Idle
    # ~85 MB. Encoding: ffmpeg reaches ~1.1 GB RSS in the AV1 1080p version (the others, 0.4-0.8 GB) and the container
    # 1.32 GB with these caps; it finished in 211 s. Without a CPU cap, ffmpeg uses up to ~6.5 cores (decoding,
    # filtering and encoding in parallel, even with 2 threads per stage): cpus bounds it, and the low priority lets the
    # rest of the VPS go first.
    mem_limit: 1536m
    cpus: 2.0

  builder:
    <<: *service
    build:
      context: ..
      dockerfile: apps/builder/Dockerfile
    restart: unless-stopped
    environment:
      BUILDER_TOKEN: *builder-token
      API_URL: http://api:8080
      SITE_URL: "${SITE_URL:?Set SITE_URL in .env, with https:// and no trailing slash}"
    healthcheck:
      <<: *healthcheck
      # The service's own GET /health, with Node (the image has no curl).
      test: ["CMD", "node", "src/healthcheck.ts"]
    volumes:
      - site:/site
    depends_on:
      init-permissions:
        condition: service_completed_successfully
      # The build reads the API: starting earlier would only waste retries.
      api:
        condition: service_healthy
    # An Astro build has memory and CPU peaks: they are bounded so they do not affect the other apps on the VPS.
    # Measured with docker stats: ~52 MB idle, ~254 MB at the peak of a build of the site with one post.
    mem_limit: 1g
    cpus: 1.0
    # Processes and threads, measured with /sys/fs/cgroup/pids.peak during a real `astro build` of the local copy (one
    # post with an image and a video): 29 at the peak, 11-19 idle. Node sizes its threads by the cpus cap (it sees 1 CPU
    # even if the host has 20), so a VPS with more cores does not multiply them: 128 leaves more than 4 times the room.
    pids_limit: 128

volumes:
  api_data: # SQLite database, session cookie keys, videos being processed, temporary files and backups in progress
  media: # uploaded images and videos (the API writes, Caddy serves)
  site: # releases/ + the current symlink (the builder writes, Caddy serves)
  caddy_data:
  caddy_config:
