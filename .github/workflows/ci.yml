# Continuous integration: the same commands that are run by hand before committing (project README, "How to
# verify"). One job per topic, in parallel; none publishes anything or uses the repo's secrets.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Read the code only: no job writes to the repo, to issues or to packages.
permissions:
  contents: read

# A new push to the same branch (or the same PR) cancels the previous run, which is already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (typecheck, tests, admin build, skills)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # corepack downloads pnpm on the first `pnpm`: without asking (there is no terminal), as in the images.
    env: &corepack-env
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The Node of the production images (apps/builder/Dockerfile, the same as infra/caddy/Dockerfile: a test in
      # infra/test compares them): one version to update, and CI tests with the one that runs on the VPS.
      - &node-version
        name: Node version of the production images
        id: node
        run: |
          version=$(sed -n 's/^ARG NODE_IMAGE=node:\([0-9.]*\)-.*/\1/p' apps/builder/Dockerfile)
          test -n "$version"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - &setup-node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          # No cache: pnpm is not installed yet here (corepack brings it in the next step).
          package-manager-cache: false

      # pnpm at the exact "packageManager" version (package.json), as in the images.
      - &pnpm
        name: pnpm from packageManager
        run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @blog/admin build
      - run: pnpm agents:check

  dotnet:
    name: .NET API (build with warnings as errors, tests with real ffmpeg)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The `dev` target of apps/api/Dockerfile: the SDK and ffmpeg 9.1 (SVT-AV1 + x264) pinned by digest, the same as
      # the production image. That way the Category=Ffmpeg tests run too.
      - name: API dev image (SDK + ffmpeg)
        run: docker build --target dev --tag blog-api-dev apps/api

      # The same command the README gives for your PC: the API mounted read-only and copied inside without bin/, obj/ or
      # the development database (nothing writes to the repo, and on Windows building on the mounted folder fails while
      # copying files). --no-build: the tests run the same binaries that built without warnings.
      - name: dotnet build -warnaserror && dotnet test
        run: >-
          docker run --rm --volume "$PWD/apps/api:/src:ro" blog-api-dev sh -euc
          'mkdir /tmp/api && tar -C /src --exclude=bin --exclude=obj --exclude=./src/Blog.Api/data -cf - . | tar -C /tmp/api -xf - &&
          cd /tmp/api && dotnet build -warnaserror && dotnet test --no-build'

  infra:
    name: Infra (compose files, Caddyfile)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The VPS compose requires its variables: placeholder values go here (there is no .env in CI, nor should there
      # be). Only in this step: in the other two, the infra/local.env values apply.
      - name: docker compose config (VPS)
        working-directory: infra
        run: docker compose -f docker-compose.yml config -q
        env: &compose-placeholders
          SITE_ADDRESS: blog.example.com
          SITE_URL: https://blog.example.com
          ADMIN_PASSWORD_HASH: ci-placeholder-not-a-hash
          BUILDER_TOKEN: ci-placeholder-not-a-token-ci-placeholder

      - name: docker compose config (Dokploy)
        working-directory: infra
        run: docker compose -f docker-compose.yml -f compose.dokploy.yml config -q
        env: *compose-placeholders

      - name: docker compose config (local production copy)
        working-directory: infra
        run: docker compose -f docker-compose.yml -f compose.local.yml --env-file local.env config -q

      - name: docker compose config (dev)
        working-directory: infra
        run: docker compose -f compose.dev.yml --env-file local.env config -q

      # With the image's Caddy (the digest-pinned reference comes from infra/caddy/Dockerfile, it is not repeated here),
      # in the forms the compose starts it: a domain with an ACME email (VPS), :80 without email (local copy) and :80 behind
# Dokploy's Traefik as staging (trusted proxies, noindex).
      - name: caddy validate
        run: |
          image=$(sed -n 's/^FROM \(caddy:[^ ]*\).*/\1/p' infra/caddy/Dockerfile)
          test -n "$image"
          validate() {
            docker run --rm --volume "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" "$@" "$image" \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          }
          validate --env SITE_ADDRESS=blog.example.com --env 'CADDY_ACME_EMAIL=email ci@example.com'
          validate --env SITE_ADDRESS=:80
          validate --env SITE_ADDRESS=:80 --env SITE_ENV=staging \
            --env 'CADDY_TRUSTED_PROXIES=trusted_proxies static private_ranges'

  images:
    name: Image ${{ matrix.service }} (build, vulnerability scan)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [api, builder, caddy]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Context, Dockerfile and target come from the VPS compose (a single definition). No push: it stays local as
      # blog-<service>, the name compose gives it.
      - name: docker compose build ${{ matrix.service }}
        working-directory: infra
        run: docker compose -f docker-compose.yml build ${{ matrix.service }}
        env: *compose-placeholders

      # Only what is serious and has a published fix: what has no fix cannot be corrected by updating the image
      # (Dependabot proposes the new bases).
      - name: Trivy (CRITICAL/HIGH with a fix)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: blog-${{ matrix.service }}
          version: v0.70.0
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Exceptions with a reason and an expiry (see the file): once expired, CI fails again.
          trivyignores: .trivyignore
          exit-code: '1'

  security:
    name: Security (secrets in history, vulnerable dependencies)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env: *corepack-env
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # the whole history: a secret deleted in a later commit is still published
          persist-credentials: false

      - *node-version
      - *setup-node
      - *pnpm

      # The three checks run even if another one fails (`!cancelled()`): each reports its own.
      - name: pnpm audit (production dependencies)
        if: ${{ !cancelled() }}
        run: pnpm audit --prod --audit-level high

      # `dotnet list package --vulnerable` exits with 0 even when it finds something: fail if it lists any package. With
      # the pinned SDK of apps/api/Dockerfile (sdk target) and the API copied inside, as in the dotnet job.
      - name: dotnet list package --vulnerable --include-transitive
        if: ${{ !cancelled() }}
        run: |
          docker build --target sdk --tag blog-api-sdk apps/api
          report=$(docker run --rm --volume "$PWD/apps/api:/src:ro" blog-api-sdk sh -euc \
            'mkdir /tmp/api && tar -C /src --exclude=bin --exclude=obj --exclude=./src/Blog.Api/data -cf - . | tar -C /tmp/api -xf - &&
             cd /tmp/api && dotnet restore --verbosity quiet >&2 && dotnet list package --vulnerable --include-transitive')
          echo "$report"
          if echo "$report" | grep -q 'has the following vulnerable packages'; then
            exit 1
          fi

      # The official image (MIT), pinned by digest: it scans every commit, with no token or license (gitleaks-action
      # asks for a license depending on the account and on a push only scans the new commits).
      - name: gitleaks (full history)
        if: ${{ !cancelled() }}
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: git --redact --verbose --no-banner /github/workspace
