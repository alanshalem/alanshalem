# Imágenes del README del perfil (assets/profile/*.svg) y la lista "Latest writing", con datos públicos de GitHub.
# El generador no tiene dependencias (no hay paso de instalación) y lee la API con el GITHUB_TOKEN de la corrida.
name: Profile

on:
  schedule:
    # Diario, lejos de la hora en punto (las corridas programadas a las :00 son las que más se demoran).
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'tooling/profile/**'
      - 'packages/tokens/src/tokens.json'
      - '.github/workflows/profile.yml'

# Nothing by default; the only job asks for what it needs below.
permissions: {}

# Una corrida programada y una por push no deben competir por commitear los mismos archivos.
concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only to commit the new images; reading public data needs no other permission.
    permissions:
      contents: write
    steps:
      # Keeps the credentials (the default): the last step pushes with them.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The Node of the production images, read the same way as in ci.yml (a workflow cannot reuse another one's
      # steps): one version to update, apps/builder/Dockerfile.
      - name: Node version of the production images
        id: node
        run: |
          version=$(sed -n 's/^ARG NODE_IMAGE=node:\([0-9.]*\)-.*/\1/p' apps/builder/Dockerfile)
          test -n "$version"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          package-manager-cache: false

      # Nunca commitear imágenes de un generador roto.
      - name: Test the generator
        run: node --test tooling/profile/test/*.test.ts

      - name: Render the profile
        run: node tooling/profile/generate.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOG_FEED_URL: ${{ vars.BLOG_FEED_URL }}

      - name: Commit if anything changed
        run: |
          git add assets/profile README.md
          if git diff --cached --quiet; then
            echo "Profile unchanged, nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(profile): refresh profile images [skip ci]'
          # master can move while this job runs (a push during the render): replay the commit on top of it and retry a
          # few times. A rebase conflict (someone edited the same generated files) fails the run; the next one
          # regenerates everything from the new master.
          for attempt in 1 2 3; do
            git pull --rebase --quiet
            if git push; then
              exit 0
            fi
            echo "::warning::Push attempt $attempt failed, retrying on top of the latest master."
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the profile images after 3 attempts."
          exit 1
