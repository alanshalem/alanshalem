# Images of the profile README (assets/profile/*.svg) and the "Latest writing" list, from public GitHub data.
# The generator has no dependencies (there is no install step) and reads the API with the run's GITHUB_TOKEN.
name: Profile

on:
  schedule:
    # Daily, away from the top of the hour (scheduled runs at :00 are the most delayed).
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'tooling/profile/**'
      - 'packages/tokens/src/tokens.css'
      - '.github/workflows/profile.yml'

# Nothing by default; the only job asks for what it needs below.
permissions: {}

# A scheduled run and a push run must not compete to commit the same files.
concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only to commit the new images; reading public data needs no other permission.
    permissions:
      contents: write
    steps:
      # Keeps the credentials (the default): the last step pushes with them. master only accepts pull requests (the
      # "master" ruleset); this deploy key is the one allowed to push straight to it (docs/release-guide.md, "Branch
      # protection"). Without the secret, checkout falls back to the run's token, which the ruleset rejects.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.PROFILE_DEPLOY_KEY }}

      # The Node of the production images, read the same way as in ci.yml (a workflow cannot reuse another one's
      # steps): one version to update, apps/builder/Dockerfile.
      - name: Node version of the production images
        id: node
        run: |
          version=$(sed -n 's/^ARG NODE_IMAGE=node:\([0-9.]*\)-.*/\1/p' apps/builder/Dockerfile)
          test -n "$version"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          package-manager-cache: false

      # Never commit images from a broken generator.
      - name: Test the generator
        run: node --test tooling/profile/test/*.test.ts

      - name: Render the profile
        run: node tooling/profile/generate.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOG_FEED_URL: ${{ vars.BLOG_FEED_URL }}

      - name: Commit if anything changed
        run: |
          git add assets/profile README.md
          if git diff --cached --quiet; then
            echo "Profile unchanged, nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(profile): refresh profile images [skip ci]'
          # master can move while this job runs (a push during the render): replay the commit on top of it and retry a
          # few times. A rebase conflict (someone edited the same generated files) fails the run; the next one
          # regenerates everything from the new master.
          for attempt in 1 2 3; do
            git pull --rebase --quiet
            if git push; then
              exit 0
            fi
            echo "::warning::Push attempt $attempt failed, retrying on top of the latest master."
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the profile images after 3 attempts."
          exit 1
