# Dependency updates: one PR per ecosystem and week (minors and patches together; a major goes alone, to review it
# separately). Every PR goes through CI (.github/workflows/ci.yml) before it is merged.
# cooldown: a just-published version waits a few days before the PR, in case it turns out broken or malicious (it has
# happened with popular actions and packages).
version: 2

updates:
  # pnpm (the whole workspace: the lockfile is at the root).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)

  # Versions centralized in apps/api/Directory.Packages.props.
  - package-ecosystem: nuget
    directory: /apps/api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)

  # Base images pinned by digest. A single PR for the three folders: Node is in two Dockerfiles (apps/builder and
  # infra/caddy) and a test in infra/test requires it to be the same.
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/builder
      - /infra/caddy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      docker-images:
        patterns: ['*']
    commit-message:
      prefix: build(infra)

  # The init-permissions image (busybox) in the VPS compose.
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    commit-message:
      prefix: build(infra)

  # Actions pinned by SHA (CI and Profile): Dependabot updates the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: build(ci)
